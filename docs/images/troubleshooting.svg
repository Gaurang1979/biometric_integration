<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
<rect width="1000" height="650" fill="white"/>
<text x="500" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="bold">Attendance Troubleshooting Map</text>
<g font-family="Arial,sans-serif" font-size="19">
<rect x="350" y="90" width="300" height="65" rx="14" fill="#f4f4f4" stroke="#333" stroke-width="2"/><text x="500" y="130" text-anchor="middle">Attendance missing?</text>
<rect x="70" y="230" width="240" height="80" rx="14" fill="#f4f4f4" stroke="#333" stroke-width="2"/><text x="190" y="265" text-anchor="middle">Device connection</text><text x="190" y="290" text-anchor="middle">fails</text>
<rect x="380" y="230" width="240" height="80" rx="14" fill="#f4f4f4" stroke="#333" stroke-width="2"/><text x="500" y="265" text-anchor="middle">Employee not</text><text x="500" y="290" text-anchor="middle">matched</text>
<rect x="690" y="230" width="240" height="80" rx="14" fill="#f4f4f4" stroke="#333" stroke-width="2"/><text x="810" y="265" text-anchor="middle">Wrong time or</text><text x="810" y="290" text-anchor="middle">duplicate</text>
<path d="M500 155 V195 H190 V230 M500 195 V230 M500 195 H810 V230" fill="none" stroke="#333" stroke-width="3"/>
<text x="190" y="365" text-anchor="middle">Check network, protocol,</text><text x="190" y="390" text-anchor="middle">port and credentials.</text>
<text x="500" y="365" text-anchor="middle">Compare Hikvision employee</text><text x="500" y="390" text-anchor="middle">identifier with Attendance Device ID.</text>
<text x="810" y="365" text-anchor="middle">Check device timezone and</text><text x="810" y="390" text-anchor="middle">duplicate grouping window.</text>
<rect x="250" y="480" width="500" height="80" rx="14" fill="#f4f4f4" stroke="#333" stroke-width="2"/><text x="500" y="515" text-anchor="middle">If still unresolved: provide HR support</text><text x="500" y="540" text-anchor="middle">employee ID + date/time + device + result</text>
</g>
</svg>
